# Extraction catalogue (task B2): what ReviewPulse extracts from a drawing, at which priority.
# Source of truth for docs/extraction_catalogue.md (python scripts/gen_docs.py; a test fails when stale).
#
# priority: P0 = an approved starter rule cannot run without it; P1 = makes results more accurate or
#           more rules runnable; P2 = later.
# needs / fns: engine capabilities (engine/context.py `has`) and check functions (rules/registry.py)
#           the item feeds. The rules that depend on it are found from the rule packs, not listed here.
# measured: {report, key} reads the value from the report's metrics block (the generator stops if the
#           report or key is missing); {report, value} quotes a table cell of a report that exists.

groups:
  geometry: Geometry
  objects: Building objects
  spaces: Spaces
  text: Text and dimensions
  document: Document structure
  derived: Derived properties

items:
- id: G1
  group: geometry
  name: Drawn primitives (lines, arcs, polylines, polygons, circles) with layer, stroke, fill
  priority: P0
  produced_by: ingest/pdf_backend.py, ingest/dxf_reader.py, ingest/svg_reader.py
  schema: Sheet.primitives
  needs: []
  fns: []
  status: done
