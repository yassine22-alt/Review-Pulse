  - {label: "FloorPlanCAD test, 100 drawings, length F1 (default pass; rules only 0.283)", report: reports/v4_fuse/2026-10-27_walls_floorplancad_learned-oracle-scale.md, key: wall_length_weighted.f1}
  - {label: "CubiCasa5K test scans, 100, F1 at 3 px", report: reports/2026-10-25_raster_model_scan.md, key: model_scan.walls_3px.f1}
