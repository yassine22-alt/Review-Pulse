# Room-label lexicon, hand-curated. Keys are vocab.yaml room types; entries are written the way
# text_classify.label_core normalises a label (lower case, accents stripped, "s.d.b" -> "sdb").
# A label matches when its core equals an entry, or starts with "<entry> " followed by at most
# 6 more characters ("chambre parents"). Dining rooms count as living space (the starter rules
# treat them together); a regulation that separates them can use the 'dining' type in a rule.
# Sources: national drafting conventions and common real-estate abbreviations per language;
# Finnish/Swedish entries cross-checked against the CubiCasa5K labels (see mined_cubicasa.yaml).
