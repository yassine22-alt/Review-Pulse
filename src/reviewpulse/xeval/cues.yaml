  ge: [almeno, non meno di, non inferiore a, minimo di]
  le: [al massimo, non più di, non superiore a, massimo di]
  gt: [più di, superiore a, maggiore di]
  lt: [meno di, inferiore a, minore di]
  after_le: [o meno]
  after_ge: [o più]
  aggregate: [somma, in totale, totale di]
  numbers: {uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10}

nl:
  decimal: ","
  words: [de, het, een, en, moet, moeten, elke, van, met, is, minstens, voor, dat, niet]
