# Vocabularies for the drawing set model. Everything language and discipline specific lives here, not in code.
# Text is folded before matching: lower case, accents removed, "ss" for the German sharp s. Write entries folded.
# To support a new language or trade, add words here; no code changes are needed.

# Kinds of view and the words a view title uses. When a title holds words of several kinds the kind earlier in
# `kind_priority` wins ("floor plan notes" is a notes block, "wall section" is a section).
kind_priority: [index, legend, schedule, notes, section, elevation, detail, site, plan]
view_kinds:
  index:
    - sheet index
    - drawing index
    - index of drawings
    - drawing list
    - sheet list
    - list of drawings
    - table of contents
    - plan index
    - planverzeichnis
    - planliste
    - inhaltsverzeichnis
    - liste des plans
    - liste des planches
    - sommaire
    - indice de planos
    - listado de planos
    - indice de laminas
  legend:
    - legend
    - legends
    - symbols
    - symbol legend
    - abbreviations
    - symbol key
    - key
    - legende
    - zeichenerklarung
    - zeichenerklaerung
    - leyenda
    - simbologia
    - abreviaturas
    - abkurzungen
  schedule:
    - schedule
    - schedules
    - table
    - tableau
    - liste
    - tabelle
    - raumbuch
    - raumliste
    - fensterliste
    - turliste
    - cuadro
    - tabla
    - planilla
    - cedula
  notes:
    - notes
    - note
    - keynotes
    - key notes
    - remarks
    - specifications
    - remarques
    - anmerkungen
    - hinweise
    - bemerkungen
    - notas
    - observaciones
  section:
    - section
    - sections
    - coupe
    - coupes
    - schnitt
    - schnitte
    - seccion
    - secciones
    - corte
    - cortes
  elevation:
    - elevation
    - elevations
    - facade
    - facades
    - ansicht
    - ansichten
    - alzado
    - alzados
    - fachada
  detail:
    - detail
    - details
    - einzelheit
    - detailzeichnung
    - detalle
    - detalles
  site:
    - site plan
    - site
    - lageplan
    - plan de situation
    - plan de masse
    - plan de situacion
    - plano de situacion
    - plano de emplazamiento
  plan:
    - plan
    - plans
    - grundriss
    - grundrisse
    - dachaufsicht
    - draufsicht
    - planta
    - plantas
    - plano
    - planos
    - layout
    - floor
    - level
    - niveau
    - geschoss
