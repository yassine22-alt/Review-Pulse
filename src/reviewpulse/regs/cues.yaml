# the weakest cues ("is the", "ist", "sind") only count where the clause sits under a definitions heading
weak_definition_cues: [is the, ist, sind]

# A heading (or the first line of a clause) that opens a list of definitions.
definition_headings:
  - definitions
  - defined terms
  - key terms
  - glossary
  - terminology
  - terms and definitions
  - interpretation
  - definitions
  - definitions
  - begriffe
  - begriffsbestimmungen
  - definiciones
  - terminos
  - vocabulaire
  - lexique
  - glossaire

# Terms that cannot be defined terms (pronouns and the like): "this means that" is not a definition.
term_stop: [this, that, which, it, there, what, who, these, those, they, he, she, ce, cela, ceci, qui, ca, il, elle, ils, es, das, dies, dieses, esto, eso, ello]

