# Cue words of the regulation graph. Everything that depends on a language lives here, none of it in the code.
# Words are written without accents or with them (both are folded the same way); matching is case blind, on word boundaries.
# To read a new language, add its words to the lists below: no code changes.

# Words that name a part of a document, grouped by what the part is. The same word may stand for more than one language.
kinds:
  article:   [article, articles, art, artikel, articulo, articulos, articolo, artigo]
  section:   [section, sections, sec, subsection, chapter, chapters, chapitre, chapitres, titre, kapitel, abschnitt, abschnitte,
              seccion, secciones, capitulo, capitulos, sezione, capitolo]
  regulation: [regulation, regulations, rule, rules, regle, regles, requirement, requirements, exigence, exigences, anforderung,
               anforderungen, requisito, requisitos, verordnung]
  paragraph: [paragraph, paragraphs, para, paras, clause, clauses, subparagraph, paragraphe, paragraphes, alinea, alineas, absatz,
              absaetze, absatze, parrafo, parrafos, paragrafo, item, items, point, points, ziffer, nummer, numero, punto, "§", "§§"]
  table:     [table, tables, tableau, tableaux, tabelle, tabellen, tabla, tablas, tabella, tabelas]
  figure:    [figure, figures, fig, diagram, diagrams, schema, schemas, abbildung, abbildungen, abb, figura, figuras, croquis, illustration]
  appendix:  [appendix, appendices, annex, annexe, annexes, anhang, anlage, anexo, anexos, apendice, allegato, schedule, part, partie, teil]

# Kinds whose label may be a single capital letter ("Appendix C", "Annexe B"); other kinds need a number.
letter_label_kinds: [appendix]

# A word written before a label in a clause's own first line that says what the clause is ("Advisory 206.2.8 ...").
# The clause is then an annotation of that label, not the clause that carries it.
annotation_prefixes: [advisory, commentary, note, notes, remarque, hinweis, nota, comment]

# Words in front of a number that mean "number" and are skipped.
number_words: ["no", nr, num, n°, numero, nummer]

# Words that join or span items of one list ("paragraphs 3.6 to 3.23", "articles 5 et 6").
conjunctions: [and, or, et, ou, und, oder, "y", o, e, "&", "and/or", "et/ou", "und/oder"]
range_words: [to, through, thru, a, au, bis, hasta, al, "-"]

# A reference that is introduced by one of these words and carries no part word ("see 3.4", "voir 5.2", "siehe 3.1").
reference_cues:
  - see
  - see also
  - refer to
  - refers to
  - referred to in
  - in accordance with
  - according to
  - as provided in
  - as specified in
  - as required by
  - as required in
  - as described in
  - as set out in
  - as given in
  - as shown in
  - comply with
  - complying with
  - complies with
  - meet the requirements of
  - pursuant to
  - voir
  - cf
  - conformement a
  - conformement aux
  - selon
  - tel que prevu a
  - prevu a
  - siehe
  - vgl
  - gemass
  - gemaess
  - nach
  - entsprechend
  - veanse
  - vease
  - segun
  - de conformidad con
  - conforme a

# Reference cues that also begin conditions ("Wenn die Bedingungen nach 3.4 erfuellt sind"): after one of these a citation may
# still be the condition itself, so a condition cue earlier in the sentence is kept.
weak_reference_cues: [nach, selon, entsprechend, according to, segun, conforme a, de conformidad con, gemass, gemaess, comply with, complying with, complies with]

