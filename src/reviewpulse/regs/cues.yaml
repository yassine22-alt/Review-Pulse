  - excluding
  - exclusive of
  - other than
  - unless
  - save that
  - save where
  - provided that the exception
  - this does not apply to
  - does not apply to
  - do not apply to
  - need not
  - is exempt
  - are exempt
  - exempt from
  - exempted from
  - sous reserve que
  - a l exception de
  - a l exception des
  - a l exception du
  - a moins que
  - a moins qu
  - sauf si
  - sauf dans
  - sauf lorsque
  - sauf
  - hormis
  - ne s appliquent pas
  - ne s applique pas
  - est dispense
  - sont dispenses
  - dispense de
  - ausgenommen
  - ausser wenn
  - ausser
  - ausnahme
  - es sei denn
  - sofern nicht
  - soweit nicht
  - mit ausnahme
  - gilt nicht fur
  - gilt nicht fuer
  - nicht anzuwenden
  - salvo que
  - salvo
  - excepto
  - a menos que
  - a excepcion de
  - no sera de aplicacion
  - no se aplica
  - quedan exentos
  - queda exento

# Cues that make a CITED clause an exception ("subject to 4.2", "sous reserve de l'article 5") but that, with nothing cited, say
# nothing ("entities subject to this section" is a scope, not an exception).
exception_ref_cues:
  - subject to
  - subject to the provisions of
  - sous reserve de
  - sous reserve des
  - sous reserve du
  - sous reserve de l
  - vorbehaltlich
  - sin perjuicio de

# The clause overrides the cited one ("notwithstanding 3.4"): the exception runs from this clause to the cited one.
override_cues:
  - notwithstanding
  - despite
  - regardless of
  - in spite of
  - nonobstant
  - malgre
  - independamment de
  - ungeachtet
  - unbeschadet
  - trotz
  - no obstante
  - a pesar de
  - independientemente de

# A clause that BEGINS with one of these words is an exception to the clause before it ("Exception 1. ...", "Ausnahme: ...").
exception_starts: [exception, exceptions, exemption, exemptions, derogation, derogations, ausnahme, ausnahmen, excepcion, excepciones, eccezione]

# The cited text is a condition on which the clause depends ("where the conditions of 4.2 are met").
condition_cues:
  - if
  - where
  - when
  - provided that
  - in case
  - in the event
  - as long as
  - wherever
  - si
  - lorsque
  - lorsqu
  - quand
  - des lors que
  - dans le cas
  - en cas de
  - pour autant que
  - wenn
  - falls
  - sofern
  - soweit
  - sobald
  - im fall
  - si
  - cuando
  - siempre que
  - en caso de
  - en el caso de

