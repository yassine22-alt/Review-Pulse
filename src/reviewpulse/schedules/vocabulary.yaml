# Header words of sheet tables, by MEANING. Add a language or a synonym by adding a line; no code names a header word.
#
# meanings: name -> {dim, words}
#   dim    what the column measures: length, area, volume, time, mass, power, voltage, count, ratio, size, text, tag
#   words  phrases (lower case, accents removed, ss for the German sharp s). A phrase matches a header when the header equals
#          it (best), contains all of its words, or is made of some of its words (weaker). One or two letter phrases only match
#          the whole header. Quote the words YAML would turn into booleans ("no", "on").
# kinds: entity kind -> words that appear in a table title, and tag prefixes.
# kind_hints: columns that point at a kind when no title says it.
# unit_aliases: how drawings write units, mapped to the unit table of interpreter/units.yaml.

